server {
  listen 80;
  root /usr/share/nginx/html;

  # SPA fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    # Stage runs stream over SSE. Without these, nginx buffers the whole
    # response and the log arrives all at once when the stage finishes —
    # which defeats the point of streaming it.
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
  }
}
