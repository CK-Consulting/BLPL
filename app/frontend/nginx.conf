# KasmVNC is a WebSocket application: this is the standard hop-by-hop
# translation, kept at http scope because that is where `map` belongs.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  root /usr/share/nginx/html;

  # Vite fingerprints every asset (index-BPytBom0.js), so the bundle itself is
  # safe to cache forever — a new build is a new filename. index.html is the
  # opposite: it is the one file that names those filenames, and caching it
  # pins the browser to a build that no longer exists on the server.
  #
  # That is not hypothetical. After the Clerk switch, a cached index.html kept
  # loading a bundle that called /api/auth/status — a route deleted in the same
  # change — so the app hung on "Checking…" against a server that was working
  # perfectly. The only clue was a 404 in the access log for an endpoint no
  # current code mentions.
  location = /index.html {
    # One directive, not `expires -1` as well: that emits its own Cache-Control
    # and the two arrive as duplicate headers. no-store rather than no-cache
    # because there is nothing to gain from a 304 on a 958-byte file, and
    # "never keep this" is the instruction that cannot be misread.
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
  }

  location /assets/ {
    # These are fingerprinted, so a cached one can never be *stale* — a changed
    # file always has a changed name. They are not cached anyway.
    #
    # 8.7 MB across 123 chunks, most of them mermaid, most of them lazily loaded,
    # served over loopback to a browser on the same machine. What immutable
    # caching saves here is a few milliseconds; what it costs is one more thing
    # that behaves differently from everything else when something goes wrong,
    # in an app where a stale view has already cost an evening. Uniform is worth
    # more than optimal at this scale.
    #
    # Worth revisiting if BLPL is ever served across a real network, where
    # re-fetching 8.7 MB per load stops being free and fingerprinting makes the
    # old rule safe again.
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
  }

  # SPA fallback. Every route lands here and is answered with index.html, so it
  # carries the same rule as index.html itself rather than relying on the
  # internal redirect to pick it up.
  location / {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    try_files $uri $uri/ /index.html;
  }

  # The KiCad desktop, under this origin rather than a port of its own.
  #
  # A second hostname through the tunnel would work and is worse: Cloudflare
  # only proxies standard ports, so `host:3010` is not reachable through it at
  # all, and a separate hostname is a separate thing to protect. Here it
  # inherits whatever guards this one — which matters, because KasmVNC as
  # configured has no authentication of its own: it answers 200 and hands over a
  # desktop with the project directory mounted.
  #
  # It works under a subpath because its assets are relative (`./assets/...`).
  # The trailing slash on proxy_pass is what strips the prefix before it reaches
  # KasmVNC; without it every request arrives as /kicad/... and 404s.
  location /kicad/ {
    # Signed in to BLPL, or nothing. KasmVNC has no authentication of its own,
    # and being at a path under this origin does not give it any — nginx has to
    # ask. The cookie Clerk sets rides a same-origin navigation, which is why
    # this can work at all where a Bearer token in JavaScript could not.
    auth_request /_authz;
    error_page 401 403 = @kicad_denied;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $kicad_desktop http://kicad-desktop:3000;
    proxy_pass $kicad_desktop/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # A desktop session is idle for long stretches and must not be cut.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
    proxy_cache off;
  }

  # Internal only: the sub-request nginx makes to decide the above. Not
  # reachable from outside, so it cannot be probed on its own.
  location = /_authz {
    internal;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $blpl_authz http://backend:8000;
    proxy_pass $blpl_authz/api/authz/gate;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header X-Original-URI $request_uri;
  }

  # Sent to the workbench to sign in, rather than a bare 401 the browser would
  # render as an error page with no way forward.
  location @kicad_denied {
    return 302 /;
  }

  location /api/ {
    # Re-resolve the backend's address instead of caching it forever.
    #
    # With a literal `proxy_pass http://backend:8000`, nginx resolves the name
    # once at config load and keeps that IP for the life of the process. Docker
    # hands out a new address every time a container is recreated, so any
    # `docker compose up --force-recreate backend` leaves nginx talking to an
    # address nothing is listening on — 502 on every request, while the backend
    # sits there perfectly healthy and `wget http://backend:8000` from this very
    # container succeeds. It looks exactly like the backend being down, and the
    # only cure was knowing to restart a container that had nothing wrong with it.
    #
    # 127.0.0.11 is Docker's embedded DNS. Assigning the upstream to a variable
    # is what forces nginx to resolve per request rather than at startup — a
    # documented quirk, and the whole point of writing it this way.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $blpl_backend http://backend:8000;
    proxy_pass $blpl_backend;
    proxy_http_version 1.1;
    # Forward the original request context. The backend no longer derives a
    # cookie flag from X-Forwarded-Proto — Clerk owns the session cookie now, on
    # its own domain — but the scheme and host are still what any absolute URL or
    # log line should reflect, and behind a tunnel this nginx is the only thing
    # that still knows them.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Project import posts the whole upload — a folder selection or a single
    # .zip — through here. nginx defaults client_max_body_size to 1m, which is
    # smaller than a typical KiCad project zip, so anything real was rejected at
    # the proxy with a bare 413 "Request Entity Too Large" and never reached the
    # backend's own check. Match importer.MAX_TOTAL_BYTES (100 MB) so the size
    # limit is enforced in one place, by the code that can explain it.
    client_max_body_size 100m;
    # Stage runs stream over SSE. Without these, nginx buffers the whole
    # response and the log arrives all at once when the stage finishes —
    # which defeats the point of streaming it.
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
  }
}
