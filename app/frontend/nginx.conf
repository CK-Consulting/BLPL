server {
  listen 80;
  root /usr/share/nginx/html;

  # SPA fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    # Forward the original request context. X-Forwarded-Proto is load-bearing:
    # the backend decides the session cookie's Secure flag from it, so if this
    # nginx sits behind a TLS terminator, the cookie is correctly marked Secure
    # over https and left unmarked over http. Getting this wrong locks users out.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Project import posts the whole upload — a folder selection or a single
    # .zip — through here. nginx defaults client_max_body_size to 1m, which is
    # smaller than a typical KiCad project zip, so anything real was rejected at
    # the proxy with a bare 413 "Request Entity Too Large" and never reached the
    # backend's own check. Match importer.MAX_TOTAL_BYTES (100 MB) so the size
    # limit is enforced in one place, by the code that can explain it.
    client_max_body_size 100m;
    # Stage runs stream over SSE. Without these, nginx buffers the whole
    # response and the log arrives all at once when the stage finishes —
    # which defeats the point of streaming it.
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
  }
}
