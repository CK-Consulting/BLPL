# Run BLPL as a hosted app on a VM you control.
#
# The point of hosting: KiCad lives here, not on your laptop. Sit down at any
# workstation, open a browser, sign in with Clerk, and the toolchain is
# byte-identical — no local KiCad to update, no per-machine path differences, and
# your projects are already here because they are git-backed on the server.
#
# What is integral and what is optional:
#
#   db, backend, worker, frontend   the app
#   kicad-desktop                   integral — drawing a footprint or a symbol
#                                   the libraries do not have is part of the
#                                   design process, not an extra
#   clamav                          integral — this deployment fetches
#                                   datasheets from the internet
#   ollama                          OPTIONAL, `local-models` profile. Off by
#                                   default: it is the heaviest service here and
#                                   the smallest contributor, and most
#                                   deployments point BLPL at a model server
#                                   somewhere else.
#
# With local models:  docker compose --profile local-models up -d
#
# Bring up:   docker compose -f app/docker-compose.yml up -d --build
# First run:  open http://<host>:1800 and sign in. Provider API keys are
#             per-user — add yours under Settings.
name: blpl
services:
  # Who exists and whose provider key is whose. The SQLite vault this replaces
  # was structurally single-tenant — one DEK from one passphrase, one secret
  # table with no owner column — so there was no version of "several people, each
  # with their own keys" that fitted inside it. Postgres is here for the
  # ownership model, not the volume.
  db:
    image: postgres:17-alpine
    container_name: blpl-db
    restart: unless-stopped
    networks:
      - blpl
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-blpl}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-blpl}
      - POSTGRES_DB=${POSTGRES_DB:-blpl}
    volumes:
      - ./blpl-db:/var/lib/postgresql/data
    # The backend runs `alembic upgrade head` before it starts, so it needs a
    # database that is genuinely accepting connections — not merely a container
    # that exists. Without this the first boot after a rebuild races and the
    # migration fails on a refused connection.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-blpl} -d ${POSTGRES_DB:-blpl}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Not published to the host. Nothing outside the compose network has any
    # business reaching it, and the keys it holds are the reason.

  backend:
    # Upstream publishes kicad/kicad:10.0.0 for linux/amd64 only — there is no
    # arm64 manifest. This deployment is amd64 Linux, so the pin is a no-op that
    # earns its place by failing loudly rather than silently emulating if the
    # image is ever built somewhere else. Pin rather than swap in a fork: see the
    # Dockerfile header for why the official image is load-bearing.
    platform: linux/amd64
    build:
      # Context is the repo root so the image can pull in blpl/ and
      # kicad-happy/ alongside the app.
      context: ..
      dockerfile: app/backend/Dockerfile
      platforms:
        - linux/amd64
      # The image carries a passwd entry and home for exactly this uid; see
      # the Dockerfile. Changing BLPL_UID means a rebuild, not a restart.
      args:
        - BLPL_UID=${BLPL_UID:?set BLPL_UID in app/.env to the owner of app/data (id -u)}
        - BLPL_GID=${BLPL_GID:?set BLPL_GID in app/.env to the owner of app/data (id -g)}
    # As the host user who owns app/data, so what a run writes is editable and
    # committable from the host without sudo, and git never sees a repository
    # owned by someone else. Required, not defaulted: a default of 0 would
    # quietly restore the root-owned drift this exists to end. Run
    # app/fix-data-ownership.sh before the first `up`: Docker creates a missing
    # ./data as root, and this uid could not then write server.key into it.
    user: "${BLPL_UID}:${BLPL_GID}"
    container_name: blpl-backend
    networks:
      - blpl
    # Lets OLLAMA_HOST=http://host.docker.internal:11434 reach an ollama server
    # running on the Docker host. On Linux this name is not resolvable by default;
    # host-gateway maps it to the host. Harmless if you instead point OLLAMA_HOST
    # at a container on the blpl network or an explicit IP.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Which project the desktop KiCad has mounted, so the gate in front of
      # it can require membership of that project rather than merely a
      # signed-in account.
      - KICAD_DESKTOP_PROJECT=${KICAD_DESKTOP_PROJECT:-none}
      - BLPL_DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-blpl}:${POSTGRES_PASSWORD:-blpl}@db:5432/${POSTGRES_DB:-blpl}
      # One data root holds what is not in Postgres: the server key, the
      # declarative config, and the project working copies.
      - BLPL_DATA_ROOT=/app/data
      - BLPL_PROJECTS_ROOT=/app/data/projects
      # Libraries shared across every project, rather than copied into each.
      #
      # symbol_resolution puts this between a project's own libraries/ and the
      # Stage 3 generated ones: a part somebody drew for THIS board still wins,
      # but a vendor footprint four boards need is written once. Each
      # subdirectory is a library root in its own right, holding <Lib>.pretty
      # and <Lib>.kicad_symdir, so a lib_id resolves exactly as it would from
      # stock.
      #
      # Under BLPL_DATA_ROOT deliberately. It is not derivable from anything in
      # git — it is a working library people add to — so it belongs beside the
      # project working copies and the server key, covered by whatever backs
      # those up. The code's own default is ~/.blpl/modules, which inside a
      # container is a path that vanishes on the next recreate; naming it here
      # is what makes it outlive one.
      - BLPL_MODULES_ROOT=/app/data/modules
      - BLPL_CONFIG=/app/data/blpl.toml
      - BLPL_KICAD_HAPPY=/app/kicad-happy
      # Where the local model server is, for both inference and for the
      # settings screen's model discovery. The compose service name, not
      # localhost: inside this container localhost is this container. Unset
      # or unresolvable when the `local-models` profile is down, which the
      # discovery endpoint reports as "could not ask" rather than as no models.
      - OLLAMA_HOST=${OLLAMA_HOST:-http://ollama:11434}
      # Where to find the malware scanner, if the `scanning` profile is up.
      # Unresolvable when it is not, which blpl.core.av reports as `unscanned`
      # rather than treating as clean.
      - BLPL_CLAMD_HOST=${BLPL_CLAMD_HOST:-clamav}
      - BLPL_CLAMD_PORT=${BLPL_CLAMD_PORT:-3310}
      # Hold anything the scanner did not see. Safe to have on because
      # clamav is always up; if it is ever taken down, every fetched
      # datasheet is held rather than quietly accepted unscanned.
      - BLPL_QUARANTINE_REQUIRE_SCAN=${BLPL_QUARANTINE_REQUIRE_SCAN:-1}
      # No provider API keys here, deliberately. Keys belong to a signed-in user
      # and live in Postgres sealed under BLPL_SERVER_KEY; a shared one in this
      # file would mean every user of the deployment spending the operator's
      # quota on the operator's account. Users bring their own, or route a task
      # to something keyless. OLLAMA_HOST is not a key — it is an address, and a
      # sensible default for the whole deployment.
      # Clerk is the front door. The backend has no Clerk SDK, so it verifies
      # session tokens against this issuer's published JWKS itself — and pins
      # the issuer, because a correctly-signed token from anyone else's Clerk
      # instance is otherwise indistinguishable from one of ours. Derived from
      # the publishable key the frontend was built with; if the two disagree,
      # every sign-in succeeds in the browser and is rejected here.
      - BLPL_CLERK_ISSUER=${BLPL_CLERK_ISSUER:-}
      # Seals every stored provider key (AES-GCM). Generated at
      # /app/data/server.key on first boot if unset. Back it up SEPARATELY from
      # the database: together they are the lock and its key, and losing it
      # makes every stored key unreadable.
      - BLPL_SERVER_KEY=${BLPL_SERVER_KEY:-}
      # Mail, for invitation notices. Plain SMTP relay rather than a provider's
      # HTTP API: hostname, credentials and a sender is the whole configuration
      # surface, so changing provider is an env change rather than a rewrite.
      # Unset means nobody is notified — a valid state for a single-user install,
      # never an error.
      - SMTP_RELAY=${SMTP_RELAY:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_SENDER_NAME=${SMTP_SENDER_NAME:-}
      - SMTP_SENDER_ADDR=${SMTP_SENDER_ADDR:-}
      # Where an invitation email should point people. Falls back to nothing,
      # in which case the mail says to open the app rather than guessing a URL.
      - BLPL_PUBLIC_URL=${BLPL_PUBLIC_URL:-}
      # Passkeys. The RP ID is the domain credentials are bound to, and the
      # origin is what the browser must be served from — usually the same
      # hostname with a scheme. Set both in production: if they are unset the
      # server infers them from the request origin, which works but drops a
      # defence-in-depth check, and changing the RP ID later invalidates every
      # passkey already enrolled.
      - BLPL_WEBAUTHN_RP_ID=${BLPL_WEBAUTHN_RP_ID:-}
      - BLPL_WEBAUTHN_ORIGIN=${BLPL_WEBAUTHN_ORIGIN:-}
      #
      # The vars below are for kicad-happy features for pulling datasheet and quotes.
      # DigiKey authenticates with the two-legged client_credentials grant — the ID
      # and secret are exchanged for a 10-minute bearer token per run, with no
      # redirect step — so the API is available on these two alone. The _OAUTH_
      # spelling is what DigiKey's portal calls them; blpl.agent.kicad_happy._CRED_MAP
      # aliases both to the DIGIKEY_CLIENT_* names the scripts read.
      #
      # CALLBACK_URL is not read at runtime by that grant. It is here because
      # registering the app on developer.digikey.com demands a redirect URI anyway,
      # and a three-legged flow (orders, MyLists) would need the real one. Likewise
      # MOUSER_ORDERS_API_KEY: passed through and unread, held for ordering work
      # that goes past what kicad-happy does. Quoting needs only the search key.
      - DIGIKEY_OAUTH_CLIENT_ID=${DIGIKEY_OAUTH_CLIENT_ID:-}
      - DIGIKEY_OAUTH_CLIENT_SECRET=${DIGIKEY_OAUTH_CLIENT_SECRET:-}
      - DIGIKEY_CALLBACK_URL=${DIGIKEY_CALLBACK_URL:-}
      - MOUSER_SEARCH_API_KEY=${MOUSER_SEARCH_API_KEY:-}
      - MOUSER_ORDERS_API_KEY=${MOUSER_ORDERS_API_KEY:-}
      - ELEMENT14_API_KEY=${ELEMENT14_API_KEY:-}
    volumes:
      # Server key, config, and your git-backed designs. Users and their sealed
      # provider keys live in Postgres (the blpl-db volume) instead — note that
      # a backup of BOTH this and that volume together carries the key and the
      # ciphertext it opens.
      - ./data:/app/data
      # 3D model libraries, so `kicad-cli pcb export glb --subst-models` can
      # substitute real component models off the official KiCad image.
      - ../kicad-packages3D:/usr/share/kicad/3dmodels:ro
      - ../kicad-packages3D-source:/usr/share/kicad/3dmodels-source:ro
      # Stock symbol/footprint libraries. The image copies blpl/schemas/kicad-happy
      # but NOT these (they are large and versioned as submodules), and inside the
      # container the CLI resolves its default library roots to /app/kicad-symbols
      # and /app/kicad-footprints (parents[2] of /app/blpl/core/cli.py). Without
      # these mounts stage5 marks every real stock symbol as a missing placeholder
      # and stage6 cannot load even Connector_Generic. Mount the same vendored
      # libraries the host pipeline uses, at exactly those default paths.
      - ../kicad-symbols:/app/kicad-symbols:ro
      - ../kicad-footprints:/app/kicad-footprints:ro
      - ../kicad-happy:/app/kicad-happy
      - ../kicad-packages:/app/kicad-packages
      - ../kicad-templates:/app/kicad-templates:ro
      - ../KiCAD-Prism:/app/kicad-prism:ro
      # An SSH deploy key for git, if your project remotes need one. The git CLI
      # in the container reads ~/.ssh; mount a read-only key here. Optional —
      # local-only projects and https remotes with a token helper don't need it.
      - ./data/ssh:/home/blpl/.ssh:ro

  # The container with KiCad in it, and the only thing that executes a stage.
  #
  # The API used to run them in-process with an in-memory subscriber list, which
  # is what pinned it to a single worker: a second API process could not see the
  # first's runs. Now the API enqueues and one of these claims the job, so runs
  # scale by adding replicas here rather than by making the API bigger.
  #
  # Same image as the backend on purpose. Splitting it would trim the API's size
  # but change nothing about where work happens, and one image means one KiCad
  # version across the deployment — two would be a way for a stage to behave
  # differently depending on which container ran it.

  # Local model serving on the host GPU. Ollama rather than vLLM or NIM for
  # this box, for three reasons that are specific rather than preference:
  #
  #   * It keeps several models resident and swaps them on demand
  #     (OLLAMA_MAX_LOADED_MODELS). vLLM and NIM are one model per process, so
  #     three specialised models would mean three servers splitting 32 GB and
  #     three sets of weights pinned whether or not anything is asking.
  #   * Most community fine-tunes for this domain ship as GGUF, which is what
  #     llama.cpp reads and what neither vLLM nor NIM will load.
  #   * It speaks the OpenAI API at /v1, which is what blpl already routes to.
  #
  # The 5090 has 32 GB. That is the budget every model here shares, and it is
  # the reason the mix is small specialised models rather than one large one —
  # the large one lives on the Thor.
  ollama:
    # Pinned. `latest` on a model server means the runtime under your models can
    # change on a `docker compose pull`, and "the same prompt answers differently
    # this week" is not a thing worth debugging twice.
    image: ollama/ollama:0.12.3
    container_name: blpl-ollama
    # The one genuinely optional service here, and the only profile in the file.
    # Off unless asked for: `docker compose --profile local-models up -d`.
    profiles: ["local-models"]
    restart: unless-stopped
    networks:
      - blpl
    volumes:
      - ollama-models:/root/.ollama
    environment:
      # Keep more than one resident so a text model and the vision model are
      # both warm; a cold load of an 8 GB model is several seconds of latency
      # on a request that was supposed to be quick.
      - OLLAMA_MAX_LOADED_MODELS=3
      - OLLAMA_KEEP_ALIVE=30m
      # Serve concurrently rather than queueing, since stage runs and the chat
      # can both be in flight.
      - OLLAMA_NUM_PARALLEL=2
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  worker:
    platform: linux/amd64
    container_name: blpl-worker
    build:
      context: ..
      dockerfile: app/backend/Dockerfile
      platforms:
        - linux/amd64
      # The image carries a passwd entry and home for exactly this uid; see
      # the Dockerfile. Changing BLPL_UID means a rebuild, not a restart.
      args:
        - BLPL_UID=${BLPL_UID:?set BLPL_UID in app/.env to the owner of app/data (id -u)}
        - BLPL_GID=${BLPL_GID:?set BLPL_GID in app/.env to the owner of app/data (id -g)}
    # As the host user who owns app/data, so what a run writes is editable and
    # committable from the host without sudo, and git never sees a repository
    # owned by someone else. Required, not defaulted: a default of 0 would
    # quietly restore the root-owned drift this exists to end. Run
    # app/fix-data-ownership.sh before the first `up`: Docker creates a missing
    # ./data as root, and this uid could not then write server.key into it.
    user: "${BLPL_UID}:${BLPL_GID}"
    restart: unless-stopped
    networks:
      - blpl
    depends_on:
      db:
        condition: service_healthy
    # A container_name IS set above, which rules out `--scale worker=N` — compose
    # cannot give four containers one name. That is the deliberate trade: this
    # deployment runs a single worker, and being able to say `docker exec
    # blpl-worker ...` is worth more here than a scale flag nobody has used. To
    # scale, drop the container_name and address workers by service instead.
    command: ["python", "-m", "app.worker"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - BLPL_DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-blpl}:${POSTGRES_PASSWORD:-blpl}@db:5432/${POSTGRES_DB:-blpl}
      - BLPL_DATA_ROOT=/app/data
      - BLPL_PROJECTS_ROOT=/app/data/projects
      # The same shared library root the backend uses — a stage resolves
      # footprints here, so the two must agree or a run resolves differently
      # depending on which container picked it up.
      - BLPL_MODULES_ROOT=/app/data/modules
      - BLPL_CONFIG=/app/data/blpl.toml
      - BLPL_KICAD_HAPPY=/app/kicad-happy
      # Where the local model server is, for both inference and for the
      # settings screen's model discovery. The compose service name, not
      # localhost: inside this container localhost is this container. Unset
      # or unresolvable when the `local-models` profile is down, which the
      # discovery endpoint reports as "could not ask" rather than as no models.
      - OLLAMA_HOST=${OLLAMA_HOST:-http://ollama:11434}
      # Where to find the malware scanner, if the `scanning` profile is up.
      # Unresolvable when it is not, which blpl.core.av reports as `unscanned`
      # rather than treating as clean.
      - BLPL_CLAMD_HOST=${BLPL_CLAMD_HOST:-clamav}
      - BLPL_CLAMD_PORT=${BLPL_CLAMD_PORT:-3310}
      # Hold anything the scanner did not see. Safe to have on because
      # clamav is always up; if it is ever taken down, every fetched
      # datasheet is held rather than quietly accepted unscanned.
      - BLPL_QUARANTINE_REQUIRE_SCAN=${BLPL_QUARANTINE_REQUIRE_SCAN:-1}
      # Needed to open the environment sealed into each job. A worker without it
      # refuses to start rather than failing one job at a time.
      - BLPL_SERVER_KEY=${BLPL_SERVER_KEY:-}
      - DIGIKEY_OAUTH_CLIENT_ID=${DIGIKEY_OAUTH_CLIENT_ID:-}
      - DIGIKEY_OAUTH_CLIENT_SECRET=${DIGIKEY_OAUTH_CLIENT_SECRET:-}
      - MOUSER_SEARCH_API_KEY=${MOUSER_SEARCH_API_KEY:-}
      - ELEMENT14_API_KEY=${ELEMENT14_API_KEY:-}
    volumes:
      # The same project files and log directory the API serves from. This is
      # what lets an SSE reader in the API tail a log a worker is writing,
      # without a broker between them.
      - ./data:/app/data
      - ../kicad-packages3D:/usr/share/kicad/3dmodels:ro
      - ../kicad-packages3D-source:/usr/share/kicad/3dmodels-source:ro
      - ../kicad-symbols:/app/kicad-symbols:ro
      - ../kicad-footprints:/app/kicad-footprints:ro
      - ../kicad-happy:/app/kicad-happy
      - ../kicad-packages:/app/kicad-packages
      - ../kicad-templates:/app/kicad-templates:ro
      - ../KiCAD-Prism:/app/kicad-prism:ro
      - ./data/ssh:/home/blpl/.ssh:ro

  frontend:
    build:
      context: ./frontend
      args:
        # Build-time, not runtime: Vite inlines VITE_* into the bundle, so a
        # container handed this at start would still serve one that never saw
        # it. Changing the key therefore needs a rebuild, not a restart.
        - VITE_CLERK_PUBLISHABLE_KEY=${VITE_CLERK_PUBLISHABLE_KEY:-}
    container_name: blpl-frontend
    environment:
        - BLPL_CLERK_ISSUER=${BLPL_CLERK_ISSUER:-}
    restart: unless-stopped
    volumes:
      # The Cloudflare Origin CA keypair for the 443 listener. Mounted, not
      # copied into the image, so the private key never becomes a layer.
      # Absent on a deployment that has not issued one — nginx then fails to
      # start rather than quietly serving http only, which is the failure worth
      # having: a tunnel configured for https against an origin that silently
      # dropped it is a broken deployment that looks fine.
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "1800:80"
      - "1443:443"
    depends_on:
      - backend
    networks:
      - blpl
  # Interactive KiCad, in a browser. A KasmVNC desktop, not part of the
  # pipeline — nothing here runs a stage, and it makes nothing faster. It is for
  # the times a person needs to open a board and look at it, drag something, or
  # use a dialog the CLI has no equivalent for.
  #
  # OFF BY DEFAULT, and the reason matters. This container has no idea who Clerk
  # says you are: anyone who reaches it gets a desktop holding whatever is
  # mounted into it, which would walk straight past the project ownership and
  # membership rules the rest of the app enforces. Start it deliberately, put it
  # behind your tunnel's access control, and mount only what that person should
  # see:
  #
  #     docker compose --profile desktop up -d kicad-desktop
  #
  # A GPU would help here and only here — the 3D viewer's OpenGL, for a human
  # spinning a board. It is not usable on this host; see the environment block.
  kicad-desktop:
    # No profile. Drawing a footprint or a symbol the libraries do not have is
    # part of the design process rather than an extra — it has been the answer
    # to a blocked board often enough that making it opt-in would only mean
    # turning it on every time.
    # Built on the published image rather than pulled from it: the one layer
    # added installs the KiKit backend (and CopperFiller's psutil) into the
    # python KiCad's plugins run in — the piece PCM cannot deliver, and the
    # piece a live `pip install` into the container loses on every recreate.
    # See kicad-desktop/Dockerfile.
    build: ./kicad-desktop
    image: blpl-kicad-desktop
    container_name: blpl-kicad-desktop
    restart: unless-stopped
    networks:
      - blpl
    environment:
      # The same uid as the backend and the worker, and for the same reason:
      # everything under data/projects and data/modules is owned by the host
      # user those containers now run as, so a desktop running as anyone else
      # opens a board it cannot save. This used to be 0, back when the pipeline
      # ran as root and root owned the files; matching moved with the owner.
      - PUID=${BLPL_UID}
      - PGID=${BLPL_GID}
      - TZ=${TZ:-Etc/UTC}
      - PIXELFLUX_WAYLAND=true
      # Software rendering, on purpose, on this host. The three lines below are
      # not a fallback that got left in — they are the only configuration that
      # produces a desktop here, and the reason is worth writing down because
      # the obvious change (AUTO_GPU=true + /dev/dri passthrough, straight out
      # of https://docs.linuxserver.io/images/docker-kicad/) makes it strictly
      # worse.
      #
      # This box has one GPU: an RTX 5090 on the proprietary `nvidia` kernel
      # driver (/dev/dri/renderD128, /dev/dri/card1 — card0 is the ASPEED BMC
      # and has no render node at all). This image is Alpine/musl, and it ships
      # Mesa: /usr/lib/dri has nouveau_dri.so and swrast, and nothing that can
      # drive a card bound to the closed driver. NVIDIA's own userspace is
      # glibc-linked, so the NVIDIA container runtime cannot supply it here
      # either.
      #
      # So passing the node in does not enable acceleration; it only gives
      # wlroots something to fail on. With /dev/dri mounted, labwc picks
      # renderD128, Mesa answers "pci id for fd 14: 10de:2b85, driver (null)",
      # EGL fails, Vulkan cannot match the DRM device, and labwc exits with
      # "unable to create renderer". s6 restarts it, it exits again, and the
      # browser gets a served page with no desktop behind it — a blank screen
      # and a log looping on "[svc-de] ... found launching de". That is exactly
      # the failure the GPU flags introduced.
      #
      # Pixman for the compositor and llvmpipe for GL inside it is the correct
      # end state for this host, not a compromise. It is also what the earlier,
      # working configuration was doing when it logged "No render node.
      # Initializing Software Renderer (Pixman)" — that line was the desktop
      # coming up, not a warning.
      #
      # On a host with an Intel or AMD GPU (or NVIDIA under a glibc image with
      # the NVIDIA container runtime and NVIDIA_DRIVER_CAPABILITIES including
      # `graphics`), drop these three, add `AUTO_GPU=true`, and pass the node:
      #
      #     devices:
      #       - /dev/dri:/dev/dri
      - WLR_RENDERER=pixman
      - WLR_RENDERER_ALLOW_SOFTWARE=1
      - LIBGL_ALWAYS_SOFTWARE=1
    volumes:
      - ./data/kicad-desktop:/config
      # Start-up scripts (linuxserver convention). The one script in here
      # registers each project's libraries/ as a WRITABLE KiCad library named
      # after the project, and the shared vendor libraries read-only under
      # their pipeline names. Without it the desktop's save dialogs offer only
      # the read-only stock mounts and PCM installs — so "draw the missing
      # symbol", the task this desktop exists for, either fails on a
      # read-only filesystem or saves into a file no pipeline stage searches.
      - ./kicad-desktop-init:/custom-cont-init.d:ro
      # One variable, two shapes, and the empty default is the useful one.
      #
      # Unset, this expands to `./data/projects/` — the whole root, so every
      # project is on the desktop at once. That is what a person moving between
      # boards actually needs, and it is why the gate in front of this
      # (/api/authz/gate) asks for membership of every project in the root
      # rather than of one named project: the desktop is a single shared Unix
      # session and cannot show different files to different callers, so the
      # permission check has to cover everything mounted. Adding a project
      # therefore narrows who may open the desktop, automatically, with no
      # second list to keep in step.
      #
      # Set it to a project name and only that project is mounted, and the gate
      # asks only about it. That is the shape for a deployment with members who
      # are not on everything.
      #
      # Two things to mind about the root form.
      #
      # Docker creates a missing bind source, so a misspelt name yields an empty
      # directory and a desktop with nothing in it rather than an error.
      # `data/projects/none` is one of those, left over from the default this
      # used to carry.
      #
      # And the gate authorizes *opening* the desktop, which is a narrower claim
      # than it reads as. This is a live mount under a long-lived session: a
      # project created by someone else after you opened the desktop shows up in
      # your running session, and per-request membership cannot bound a session
      # that makes no further request. Closing that needs revocation inside the
      # desktop, which does not exist. Nothing on a one-operator deployment; the
      # reason a deployment with accounts that are not on everything should name
      # a single project here rather than mount the root.
      - ./data/projects/${KICAD_DESKTOP_PROJECT:-}:/config/projects
      # The shared component library, READ-ONLY by default, and the default is
      # the point.
      #
      # This mount is deployment-wide while the gate in front of the desktop may
      # not be. With KICAD_DESKTOP_PROJECT naming a project, /api/authz/gate
      # admits any member of *that* project — correctly, it is their project —
      # and a writable mount would then let them alter footprints and symbols
      # that every other project's runs resolve against, including projects they
      # cannot open. Membership of one board would become write access to the
      # library behind all of them, which is a wider grant than anything else
      # here hands out and is not one anybody asked for.
      #
      # There is no per-user answer available: the desktop is a single shared
      # Unix session and cannot show one caller a writable library and another a
      # read-only one. So the boundary has to be the mount, and the safe side
      # has to be the default.
      #
      # Set KICAD_SHARED_LIBRARIES=rw only where the desktop is already
      # deployment-wide — that is, with KICAD_DESKTOP_PROJECT unset, where the
      # gate demands membership of every project in the root and so already
      # implies the standing to edit what they share. Pairing it with a named
      # project is the combination this default exists to stop.
      #
      # Read-only does not block the drawing workflow, it stages it: save into
      # the project's own libraries/, which is writable and searched first, and
      # promote deliberately. A part earning a place in the shared library is a
      # decision worth making on purpose rather than by autosave.
      - ./data/modules:/config/shared-libraries:${KICAD_SHARED_LIBRARIES:-ro}
      - ../kicad-symbols:/usr/share/kicad/symbols:ro
      - ../kicad-footprints:/usr/share/kicad/footprints:ro
      - ../kicad-packages3D:/usr/share/kicad/3dmodels:ro
    # Loopback only, and no websocket port. Both halves matter.
    #
    # The stream does not need a second published port. Selkies' client builds
    # its socket URL from the page it was served by — location.pathname up to
    # the last slash, plus "websockets" — and the container's own nginx has a
    # `location /websocket` (a prefix, so /websockets matches) proxying to
    # 127.0.0.1:8082 internally. Served at /kicad/ it therefore asks for
    # /kicad/websockets on this origin, which the frontend passes through with
    # the prefix stripped. Publishing 8082 adds nothing the browser uses.
    #
    # What it does add is a way around the gate. This desktop has no
    # authentication of its own; the only thing standing in front of it is the
    # `auth_request` in the frontend's /kicad/ location. A port published on
    # 0.0.0.0 is reachable without passing through that, which is the whole
    # boundary undone by a line in a ports list. 3010 stays for looking at the
    # container directly from this machine, bound where only this machine can
    # reach it.
    ports:
      - "127.0.0.1:${KICAD_DESKTOP_PORT:-3010}:3000"
    # KasmVNC needs a larger shared memory segment than Docker's 64 MB default;
    # without it the desktop dies as soon as anything opens a real window.
    shm_size: "4gb"
    security_opt:
      - seccomp:unconfined


  # Malware scanning for retrieved files. Optional, and off unless you start it:
  #
  #   docker compose --profile scanning up -d
  #
  # A profile rather than a plain service because clamd holds its whole
  # signature database in memory (~1.5-2 GB) and updates it on a schedule. That
  # is a fair price for a deployment that fetches datasheets from the internet
  # and a silly one for a laptop running the test suite, so it is a decision
  # rather than a default.
  #
  # Nothing breaks when this is absent: blpl.core.av reports `unscanned`, the
  # quarantine ledger records that nothing checked the file, and the structural
  # inspection in blpl.core.pdf_inspect — which is the check that actually stops
  # a datasheet phoning home — runs either way.
  #
  # BLPL_QUARANTINE_REQUIRE_SCAN is set on backend and worker rather than here,
  # because those are the processes that read it. It was on this service, where
  # nothing has ever looked at it — so the setting that holds an unscanned file
  # was, in effect, off.
  clamav:
    image: clamav/clamav:stable
    container_name: blpl-clamav
    # No profile: this deployment fetches datasheets from the internet, so the
    # scanner is part of the deployment rather than a decision.
    restart: unless-stopped
    networks:
      - blpl
    volumes:
      # Persist the signature database. Without it every restart re-downloads
      # ~1 GB from the ClamAV mirrors, which is rude to them and slow for you.
      - clamav-db:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 60s
      retries: 3
      start_period: 120s


networks:
  blpl:
    external: true

volumes:
  ollama-models:
  clamav-db:
  # No blpl-db here. One was declared for a long time and never used: the db
  # service binds ./blpl-db instead, so the named volume was dead config that
  # read as the live arrangement. The bind mount is deliberate — the same
  # reasoning as ./data, which is that being able to look at the bytes from the
  # host has been worth more during development than the isolation a named
  # volume buys. The original comment warned about bind-mounting Postgres onto
  # a macOS filesystem; this deployment is Linux, where that does not apply.
