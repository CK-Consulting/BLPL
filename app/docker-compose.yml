# Run BLPL as a hosted app on a VM you control.
#
# The point of hosting: KiCad lives here, not on your laptop. Sit down at any
# workstation, open a browser, sign in with Clerk, and the toolchain is
# byte-identical — no local KiCad to update, no mac-vs-linux path mismatches, and
# your projects are already here because they are git-backed on the server.
#
# Bring up:   docker compose -f app/docker-compose.yml up -d --build
# First run:  open http://<host>:1800 and sign in. Provider API keys are
#             per-user — add yours under Settings.
services:
  # Who exists and whose provider key is whose. The SQLite vault this replaces
  # was structurally single-tenant — one DEK from one passphrase, one secret
  # table with no owner column — so there was no version of "several people, each
  # with their own keys" that fitted inside it. Postgres is here for the
  # ownership model, not the volume.
  db:
    image: postgres:17-alpine
    container_name: blpl-db
    restart: unless-stopped
    networks:
      - blpl
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-blpl}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-blpl}
      - POSTGRES_DB=${POSTGRES_DB:-blpl}
    volumes:
      - blpl-db:/var/lib/postgresql/data
    # The backend runs `alembic upgrade head` before it starts, so it needs a
    # database that is genuinely accepting connections — not merely a container
    # that exists. Without this the first boot after a rebuild races and the
    # migration fails on a refused connection.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-blpl} -d ${POSTGRES_DB:-blpl}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Not published to the host. Nothing outside the compose network has any
    # business reaching it, and the keys it holds are the reason.

  backend:
    # Upstream publishes kicad/kicad:10.0.0 for linux/amd64 only — there is no
    # arm64 manifest. Without this pin the build dies with "no match for platform
    # in manifest" on any Apple Silicon dev machine. On an amd64 server this is a
    # no-op (already native); on arm64 it runs under Rosetta/QEMU emulation, which
    # is slower but correct. Pin it rather than swap in a fork: see the Dockerfile
    # header for why the official image is load-bearing.
    platform: linux/amd64
    build:
      # Context is the repo root so the image can pull in blpl/ and
      # kicad-happy/ alongside the app.
      context: ..
      dockerfile: app/backend/Dockerfile
      platforms:
        - linux/amd64
    container_name: blpl-backend
    networks:
      - blpl
    # Lets OLLAMA_HOST=http://host.docker.internal:11434 reach an ollama server
    # running on the Docker host. On Linux this name is not resolvable by default;
    # host-gateway maps it to the host. Harmless if you instead point OLLAMA_HOST
    # at a container on the blpl network or an explicit IP.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - BLPL_DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-blpl}:${POSTGRES_PASSWORD:-blpl}@db:5432/${POSTGRES_DB:-blpl}
      # One data root holds what is not in Postgres: the server key, the
      # declarative config, and the project working copies.
      - BLPL_DATA_ROOT=/app/data
      - BLPL_PROJECTS_ROOT=/app/data/projects
      - BLPL_CONFIG=/app/data/blpl.toml
      - BLPL_KICAD_HAPPY=/app/kicad-happy
      # No provider API keys here, deliberately. Keys belong to a signed-in user
      # and live in Postgres sealed under BLPL_SERVER_KEY; a shared one in this
      # file would mean every user of the deployment spending the operator's
      # quota on the operator's account. Users bring their own, or route a task
      # to something keyless. OLLAMA_HOST is not a key — it is an address, and a
      # sensible default for the whole deployment.
      - OLLAMA_HOST=${OLLAMA_HOST:-}
      # Clerk is the front door. The backend has no Clerk SDK, so it verifies
      # session tokens against this issuer's published JWKS itself — and pins
      # the issuer, because a correctly-signed token from anyone else's Clerk
      # instance is otherwise indistinguishable from one of ours. Derived from
      # the publishable key the frontend was built with; if the two disagree,
      # every sign-in succeeds in the browser and is rejected here.
      - BLPL_CLERK_ISSUER=${BLPL_CLERK_ISSUER:-}
      # Seals every stored provider key (AES-GCM). Generated at
      # /app/data/server.key on first boot if unset. Back it up SEPARATELY from
      # the database: together they are the lock and its key, and losing it
      # makes every stored key unreadable.
      - BLPL_SERVER_KEY=${BLPL_SERVER_KEY:-}
      #
      # The vars below are for kicad-happy features for pulling datasheet and quotes.
      # DigiKey authenticates with the two-legged client_credentials grant — the ID
      # and secret are exchanged for a 10-minute bearer token per run, with no
      # redirect step — so the API is available on these two alone. The _OAUTH_
      # spelling is what DigiKey's portal calls them; blpl.agent.kicad_happy._CRED_MAP
      # aliases both to the DIGIKEY_CLIENT_* names the scripts read.
      #
      # CALLBACK_URL is not read at runtime by that grant. It is here because
      # registering the app on developer.digikey.com demands a redirect URI anyway,
      # and a three-legged flow (orders, MyLists) would need the real one. Likewise
      # MOUSER_ORDERS_API_KEY: passed through and unread, held for ordering work
      # that goes past what kicad-happy does. Quoting needs only the search key.
      - DIGIKEY_OAUTH_CLIENT_ID=${DIGIKEY_OAUTH_CLIENT_ID:-}
      - DIGIKEY_OAUTH_CLIENT_SECRET=${DIGIKEY_OAUTH_CLIENT_SECRET:-}
      - DIGIKEY_CALLBACK_URL=${DIGIKEY_CALLBACK_URL:-}
      - MOUSER_SEARCH_API_KEY=${MOUSER_SEARCH_API_KEY:-}
      - MOUSER_ORDERS_API_KEY=${MOUSER_ORDERS_API_KEY:-}
      - ELEMENT14_API_KEY=${ELEMENT14_API_KEY:-}
    volumes:
      # Server key, config, and your git-backed designs. Users and their sealed
      # provider keys live in Postgres (the blpl-db volume) instead — note that
      # a backup of BOTH this and that volume together carries the key and the
      # ciphertext it opens.
      - ./data:/app/data
      # 3D model libraries, so `kicad-cli pcb export glb --subst-models` can
      # substitute real component models off the official KiCad image.
      - ../kicad-packages3D:/usr/share/kicad/3dmodels:ro
      - ../kicad-packages3D-source:/usr/share/kicad/3dmodels-source:ro
      # Stock symbol/footprint libraries. The image copies blpl/schemas/kicad-happy
      # but NOT these (they are large and versioned as submodules), and inside the
      # container the CLI resolves its default library roots to /app/kicad-symbols
      # and /app/kicad-footprints (parents[2] of /app/blpl/core/cli.py). Without
      # these mounts stage5 marks every real stock symbol as a missing placeholder
      # and stage6 cannot load even Connector_Generic. Mount the same vendored
      # libraries the host pipeline uses, at exactly those default paths.
      - ../kicad-symbols:/app/kicad-symbols:ro
      - ../kicad-footprints:/app/kicad-footprints:ro
      - ../kicad-happy:/app/kicad-happy
      - ../kicad-packages:/app/kicad-packages
      - ../kicad-templates:/app/kicad-templates:ro
      - ../KiCAD-Prism:/app/kicad-prism:ro
      # An SSH deploy key for git, if your project remotes need one. The git CLI
      # in the container reads ~/.ssh; mount a read-only key here. Optional —
      # local-only projects and https remotes with a token helper don't need it.
      - ./data/ssh:/root/.ssh:ro

  frontend:
    build:
      context: ./frontend
      args:
        # Build-time, not runtime: Vite inlines VITE_* into the bundle, so a
        # container handed this at start would still serve one that never saw
        # it. Changing the key therefore needs a rebuild, not a restart.
        - VITE_CLERK_PUBLISHABLE_KEY=${VITE_CLERK_PUBLISHABLE_KEY:-}
    container_name: blpl-frontend
    restart: unless-stopped
    ports:
      - "1800:80"
    depends_on:
      - backend
    networks:
      - blpl
networks:
  blpl:
    external: true

volumes:
  # A named volume, not a bind mount under ./data like the rest of the app's
  # state. Postgres owns its data directory's permissions and ownership, and a
  # bind mount onto a macOS filesystem is exactly where that goes wrong.
  blpl-db:
