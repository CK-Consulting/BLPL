[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blpl"
version = "0.2.0"
description = "Board Layer Pipe Line — markdown-to-KiCad hardware design pipeline."
# The headless pipeline: future repository "blpl-core". The LLM agent layer
# (blpl.agent) ships here too, behind the llm-* extras, for now.
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.21",
    "markdown-it-py>=3.0",
    # Reads a PDF's own table structure — ruling lines, cell bounds, the text
    # inside each cell. Pure Python on pdfminer.six: no models, no GPU, no OCR.
    # A datasheet's pin table is a grid and the file says so; flattening it to
    # text and asking something to infer the grid back is what every failed
    # approach here had in common.
    "pdfplumber>=0.11",
]

[project.optional-dependencies]
llm-anthropic = ["anthropic>=0.39"]
llm-openai = ["openai>=1.0"]
llm-ollama = ["ollama>=0.3"]
all-llm = ["anthropic>=0.39", "openai>=1.0", "ollama>=0.3"]
# The web app's dependencies (FastAPI, uvicorn, python-multipart, ...) are not
# an extra of this package any more: the app is its own tree (app/, the future
# "blpl-app" repository) and pins them in app/backend/requirements.txt. `blpl
# serve` launches that backend and says so when they are missing.
dev = ["pytest>=7.4", "rich>=13.0"]

[project.scripts]
blpl = "blpl.core.cli:main"
# Back-compat alias for anything still using the old name.
hdm-pipeline = "blpl.core.cli:main"

[tool.setuptools.packages.find]
include = ["blpl*"]
exclude = ["tests*", "kicad-*", "schemas*", "mermaid*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.setuptools.package-data]
"blpl.skills" = ["hardware-design/SKILL.md"]
