name: Feature request
description: Something BLPL should do
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that BLPL makes hard or impossible?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
