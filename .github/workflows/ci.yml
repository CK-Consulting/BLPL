name: CI

# Every pull request and every push to main runs the Python suite (pipeline
# and API) and the frontend's tests and build. Read-only: nothing here needs to
# write, and a pull request from a fork must not be able to.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The lowest supported version and a current one: workspace cleanup,
        # for one, takes a different code path below 3.12.
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false

      # The emitter and library tests resolve against KiCad's stock symbols and
      # footprints, and stage 7's KLC check lives in kicad-library-utils. The
      # other submodules are large and not needed here.
      - name: Stock KiCad libraries
        run: git submodule update --init --depth 1 -- kicad-symbols kicad-footprints kicad-library-utils

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]' -r app/backend/requirements.txt

      - name: Test
        run: python -m pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"  # matches app/frontend/Dockerfile
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - run: npm ci
      - run: npx vitest run
      - run: npm run build
