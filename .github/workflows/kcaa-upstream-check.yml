name: kcaa upstream check

# Keeps kicad-ai-assistant tracking its fork's main
# (which a workflow in the fork keeps synced with upstream paul356/KiCad-AI-Assistant).
#
# Weekly (and on demand): advance the submodule to the fork's latest main, run
# kcaa's own test suite plus BLPL's contract check, then open a bump PR when
# green or an issue when red.
# On PRs that touch the submodule: run the same checks against the pinned SHA.
#
# NOTE: the scheduled trigger only fires once this file is on the default branch.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC, after the fork's daily upstream sync
  workflow_dispatch:
  pull_request:
    paths:
      - kicad-ai-assistant
      - tests/kcaa_contract_check.py
      - .gitmodules
      - .github/workflows/kcaa-upstream-check.yml

permissions:
  contents: write   # push the bump branch
  issues: write     # say the bump is ready, or that a check broke

env:
  SUBMODULE_PATH: kicad-ai-assistant

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # The repo carries many large submodules (KiCad libraries); init only kcaa.
        with:
          submodules: false

      - name: Init kcaa submodule
        run: git submodule update --init --depth 1 -- "$SUBMODULE_PATH"

      - name: Advance submodule to fork main (scheduled/manual runs only)
        id: advance
        if: github.event_name != 'pull_request'
        run: |
          cd "$SUBMODULE_PATH"
          old=$(git rev-parse HEAD)
          git fetch --depth 1 origin main
          git checkout --detach FETCH_HEAD
          new=$(git rev-parse HEAD)
          echo "old=$old" >> "$GITHUB_OUTPUT"
          echo "new=$new" >> "$GITHUB_OUTPUT"
          echo "changed=$([ "$old" != "$new" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "Submodule: $old -> $new"

      - name: Install uv
        if: github.event_name == 'pull_request' || steps.advance.outputs.changed == 'true'
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      # kcaa's own CI tests on 3.13 with node/jsdom available; mirror that.
      - name: Set up Python 3.13
        if: github.event_name == 'pull_request' || steps.advance.outputs.changed == 'true'
        working-directory: kicad-ai-assistant
        run: |
          uv python install 3.13
          uv python pin 3.13

      - name: Install Node.js
        if: github.event_name == 'pull_request' || steps.advance.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install kcaa deps
        if: github.event_name == 'pull_request' || steps.advance.outputs.changed == 'true'
        working-directory: kicad-ai-assistant
        run: |
          uv sync --group dev
          npm install jsdom

      - name: Run kcaa test suite
        id: kcaa_tests
        if: github.event_name == 'pull_request' || steps.advance.outputs.changed == 'true'
        working-directory: kicad-ai-assistant
        env:
          KICAD_VERSION: "10"
        run: uv run python -m pytest tests/ --tb=short -o "addopts="

      - name: Run BLPL contract check
        id: contract
        if: github.event_name == 'pull_request' || steps.advance.outputs.changed == 'true'
        working-directory: kicad-ai-assistant
        env:
          KICAD_VERSION: "10"
        run: uv run python ../tests/kcaa_contract_check.py

      # No pull request is opened from here, deliberately. Creating one needs
      # "Allow GitHub Actions to create and approve pull requests", and that same
      # switch also lets Actions *approve* pull requests — which is a review
      # bypass waiting for the day this repository gets branch protection. The
      # bump is one click either way, and it is only ever needed on the weeks
      # upstream has actually moved. So: push the branch, say so, stay green.
      - name: Push the bump branch
        id: bump_branch
        if: github.event_name != 'pull_request' && steps.advance.outputs.changed == 'true' && success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B bots/kcaa-upstream-bump
          git add -- "$SUBMODULE_PATH"
          git commit -m "Bump kicad-ai-assistant to latest fork main

          ${{ steps.advance.outputs.old }} -> ${{ steps.advance.outputs.new }}
          kcaa test suite and BLPL contract check passed in the triggering run."
          git push --force-with-lease origin bots/kcaa-upstream-bump

      - name: Say the bump is ready
        if: github.event_name != 'pull_request' && steps.advance.outputs.changed == 'true' && success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create kcaa-upstream --force --description "kicad-ai-assistant upstream tracking" --color FBCA04 || true
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          compare="${{ github.server_url }}/${{ github.repository }}/compare/main...bots/kcaa-upstream-bump?expand=1"
          body=$(cat <<EOF
          kcaa's test suite and the BLPL contract check both passed against the fork's
          latest main, and \`bots/kcaa-upstream-bump\` is pushed and ready:

          \`${{ steps.advance.outputs.old }}\` → \`${{ steps.advance.outputs.new }}\`

          Open it here: $compare

          Run: $run_url
          EOF
          )
          existing=$(gh issue list --label kcaa-upstream --state open --search "in:title ready to open" --json number -q '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "kcaa bump ready to open" --label kcaa-upstream --body "$body"
          fi

      # Only the two checks above say anything about compatibility. `failure()`
      # alone covered every step, so when the bump PR could not be opened — a
      # repository permission, nothing to do with kcaa — this filed an issue
      # announcing that upstream had broken the contract. It had not. An alarm
      # that names the wrong cause is worse than none: it sends whoever reads it
      # looking for a fault that was never there.
      - name: File breakage issue
        if: >-
          github.event_name != 'pull_request' && failure() &&
          (steps.kcaa_tests.outcome == 'failure' || steps.contract.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create kcaa-upstream --force --description "kicad-ai-assistant upstream tracking" --color FBCA04 || true
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          existing=$(gh issue list --label kcaa-upstream --state open --json number -q '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still failing: $run_url"
          else
            gh issue create \
              --title "kicad-ai-assistant upstream update breaks checks" \
              --label kcaa-upstream \
              --body "The weekly upstream check failed — either kcaa's test suite or BLPL's contract check (\`tests/kcaa_contract_check.py\`) broke against the fork's latest main. See $run_url. The submodule pointer was NOT bumped."
          fi
